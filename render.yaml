databases:
  - name: ai-assistant-chat-db
    databaseName: ai_assistant_chat
    user: ai_assistant_chat_user

services:
  - type: web
    name: ai-assistant-chat
    env: node
    buildCommand: npm ci && npm run build
    startCommand: npx prisma generate && npx prisma db push --accept-data-loss && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_APP_URL
        value: https://ai-assistant-chat-iczt.onrender.com
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        value: write_products,read_products,write_collections,read_collections
      - key: SHOPIFY_SHOP
        sync: false
      - key: SHOPIFY_ADMIN_API_ACCESS_TOKEN
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-assistant-chat-db
          property: connectionString
      # Ollama Configuration
      - key: OLLAMA_ENABLED
        value: "true"
      - key: OLLAMA_ENDPOINT
        value: "http://localhost:11434"
      - key: OLLAMA_MODEL
        value: "whisper"
      - key: OLLAMA_FALLBACK_ENABLED
        value: "true"
      # Voice Search Configuration
      - key: VOICE_SEARCH_ENABLED
        value: "true"
      - key: VOICE_LANGUAGE
        value: "en-US"
      - key: VOICE_TIMEOUT
        value: "5000"
      # Additional Environment Variables
      - key: SHOP_CUSTOM_DOMAIN
        sync: false
      - key: FRONTEND_PORT
        value: "10000"
      - key: HMR_SERVER_PORT
        value: "8002"
      - key: PORT
        value: "10000"
      # Build-time Environment Variables
      - key: HOST
        value: "https://ai-assistant-chat-iczt.onrender.com"
    buildFilter:
      paths:
        - app/**
        - package.json
        - package-lock.json
        - vite.config.js
        - remix.config.js
        - tsconfig.json
        - prisma/** 