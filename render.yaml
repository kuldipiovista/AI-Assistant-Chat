databases:
  - name: ai-assistant-chat-db
    databaseName: ai_assistant_chat
    user: ai_assistant_chat_user

services:
  - type: web
    name: ai-assistant-chat
    env: node
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_APP_URL
        value: https://ai-assistant-chat-iczt.onrender.com
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        value: write_products,read_products,write_collections,read_collections
      - key: SHOPIFY_SHOP
        sync: false
      - key: SHOPIFY_ADMIN_API_ACCESS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-assistant-chat-db
          property: connectionString 